[project]
name = "kata"
version = "0.1.0"
description = "A python project used to exercise yourself with katas"
readme = "README.md"
authors = [
    { name = "matthieusb" }
]
requires-python = ">=3.15"
dependencies = []

[project.scripts]
hello-world = "kata:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "assertpy>=2.36.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
