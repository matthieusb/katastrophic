name: Python 3.15 CI Workflow

inputs:
  project-folder:
    description: Python 3.15 project folder
    required: true
    default: 'starters/technical-starters/python/python3.15'

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4

    - name: install:uv
      shell: sh
      run: uv sync
      working-directory: ${{ inputs.project-folder }}

    - name: test:uv
      shell: sh
      run: uv run pytest
      working-directory: ${{ inputs.project-folder }}